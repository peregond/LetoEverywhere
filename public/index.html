<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Лето повсюду">
  <link rel="manifest" href="./collection.webmanifest">
  <link rel="apple-touch-icon" href="./assets/nikola-icon-180-buzz-v3.png">
  <link rel="stylesheet" href="./collection.css?v=2">
  <title>Лето повсюду — истории</title>
</head>
<body>
  <main class="stories" aria-label="Выберите историю">
    <article class="story georgia">
      <img class="story-art" src="./georgia/home-cover-wide.webp" alt="" fetchpriority="high">
      <h1>Грузинское <em>лето</em></h1>
      <a class="launch" id="play-georgia" href="./georgia/">Запустить<span class="sr-only"> Грузинское лето</span></a>
    </article>
    <article class="story belgrade">
      <img class="story-art" src="./assets/home/belgrade-day.webp" alt="" loading="lazy">
      <div class="belgrade-cast" aria-hidden="true">
        <img src="./assets/home/milica-casual.webp" alt="" loading="lazy">
        <img src="./assets/home/dragan-casual.webp" alt="" loading="lazy">
        <img src="./assets/home/jelena-casual.webp" alt="" loading="lazy">
        <img src="./assets/home/nikola-casual.webp" alt="" loading="lazy">
      </div>
      <h2>Белградское <em>лето</em></h2>
      <a class="launch" id="play" href="./belgrade.html">Запустить<span class="sr-only"> Белградское лето</span></a>
    </article>
    <article class="story istanbul">
      <img class="story-art" src="./assets/istanbul-cat-cover.webp" alt="" loading="lazy">
      <h2>Стамбульское <em>лето</em></h2>
      <button class="launch soon" type="button" disabled>Скоро<span class="sr-only">: Стамбульское лето</span></button>
    </article>
  </main>
  <script>
    for (const [id, story] of [['play-georgia', 'georgia'], ['play', 'belgrade']]) {
      document.getElementById(id).addEventListener('click', () => { try { localStorage.setItem('leto-last', story); } catch {} });
    }
  </script>
  <script src="./directional-navigation.js" defer></script>
</body>
</html>
